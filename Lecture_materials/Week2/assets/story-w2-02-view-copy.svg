<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#64748b"/></marker></defs>
  <text x="50" y="52" font-size="28" font-weight="700" fill="#1f4e9d">부분 배열 수정: 원본과 공유할까, 독립시킬까?</text>
  <rect x="70" y="145" width="250" height="100" rx="14" fill="#f4f7fb" stroke="#1f4e9d" stroke-width="3"/><text x="195" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#1f4e9d">원본 데이터 버퍼</text><text x="195" y="220" text-anchor="middle" font-size="20" fill="#222">[10, 20, 30, 40]</text>
  <path d="M345 170 H425" stroke="#1f4e9d" stroke-width="4" marker-end="url(#a)"/><path d="M345 220 H425" stroke="#1f6e3a" stroke-width="4" marker-end="url(#a)"/>
  <rect x="450" y="100" width="220" height="105" rx="14" fill="#eef5ff" stroke="#1f4e9d" stroke-width="3"/><text x="560" y="138" text-anchor="middle" font-size="22" font-weight="700" fill="#1f4e9d">View · 공유</text><text x="560" y="172" text-anchor="middle" font-size="18" fill="#222">수정 20 → 999</text><text x="560" y="195" text-anchor="middle" font-size="18" fill="#c0392b">원본도 999</text>
  <rect x="450" y="235" width="220" height="105" rx="14" fill="#f1f8f3" stroke="#1f6e3a" stroke-width="3"/><text x="560" y="273" text-anchor="middle" font-size="22" font-weight="700" fill="#1f6e3a">Copy · 독립</text><text x="560" y="307" text-anchor="middle" font-size="18" fill="#222">수정 20 → 999</text><text x="560" y="330" text-anchor="middle" font-size="18" fill="#1f6e3a">원본은 20 유지</text>
  <path d="M695 152 H775" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M695 288 H775" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
  <rect x="800" y="135" width="145" height="180" rx="16" fill="#fff7e8" stroke="#a86b00" stroke-width="3"/><text x="872" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#a86b00">선택 질문</text><text x="872" y="225" text-anchor="middle" font-size="18" fill="#222">원본에도</text><text x="872" y="250" text-anchor="middle" font-size="18" fill="#222">수정이 전달돼야</text><text x="872" y="275" text-anchor="middle" font-size="18" fill="#222">하는가?</text>
</svg>
