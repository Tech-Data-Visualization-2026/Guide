<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#64748b"/></marker></defs>
  <text x="50" y="52" font-size="28" font-weight="700" fill="#1f4e9d">같은 단위의 많은 숫자: 반복 대신 배열 전체 연산</text>
  <rect x="50" y="100" width="250" height="220" rx="16" fill="#f4f7fb" stroke="#1f4e9d" stroke-width="3"/>
  <text x="175" y="140" text-anchor="middle" font-size="23" font-weight="700" fill="#1f4e9d">Python List</text>
  <text x="175" y="180" text-anchor="middle" font-size="19" fill="#222">10 → ×2 → 20</text><text x="175" y="215" text-anchor="middle" font-size="19" fill="#222">20 → ×2 → 40</text><text x="175" y="250" text-anchor="middle" font-size="19" fill="#222">30 → ×2 → 60</text>
  <text x="175" y="290" text-anchor="middle" font-size="18" fill="#a86b00">원소마다 반복 지시</text>
  <path d="M325 210 H425" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
  <rect x="450" y="100" width="250" height="220" rx="16" fill="#f1f8f3" stroke="#1f6e3a" stroke-width="3"/>
  <text x="575" y="140" text-anchor="middle" font-size="23" font-weight="700" fill="#1f6e3a">NumPy 배열</text>
  <text x="575" y="190" text-anchor="middle" font-size="22" fill="#222">[10, 20, 30] × 2</text><text x="575" y="235" text-anchor="middle" font-size="22" fill="#1f6e3a">[20, 40, 60]</text>
  <text x="575" y="290" text-anchor="middle" font-size="18" fill="#1f6e3a">하나의 dtype · 한 번의 연산 요청</text>
  <path d="M725 210 H815" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
  <rect x="840" y="125" width="115" height="170" rx="16" fill="#fff7e8" stroke="#a86b00" stroke-width="3"/>
  <text x="897" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#a86b00">검증</text><text x="897" y="210" text-anchor="middle" font-size="18" fill="#222">같은</text><text x="897" y="236" text-anchor="middle" font-size="18" fill="#222">결과인가?</text>
</svg>
