<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>데이터시각화 강의자료</title>
  <style>
    :root{--accent:#174f56;--paper:#f4f1e8;--panel:#fffdf7;--line:#d7d1c2;--text:#243035;--muted:#687276}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;background:#122327;color:var(--text);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}
    main{width:min(920px,calc(100% - 40px));background:var(--paper);border:1px solid var(--line);padding:64px}.mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--accent);border-radius:50%;color:var(--accent);font:22px serif}
    .eyebrow{margin:30px 0 12px;color:var(--accent);font-size:15px;font-weight:800;letter-spacing:.16em}h1{margin:0;font:500 clamp(42px,7vw,72px)/1.15 "Noto Serif KR","Nanum Myeongjo",serif;letter-spacing:-.04em;color:var(--accent)}p{margin:22px 0 42px;color:var(--muted);font-size:21px;line-height:1.6}
    .picker{display:grid;grid-template-columns:1fr auto;gap:12px;padding-top:28px;border-top:2px solid var(--accent)}label{grid-column:1/-1;color:var(--accent);font-weight:800}select,button{min-height:54px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 18px;font:700 18px system-ui,sans-serif}button{border-color:var(--accent);background:var(--accent);color:white;cursor:pointer}.note{margin:18px 0 0;font-size:15px;color:var(--muted)}@media(max-width:640px){main{padding:36px 24px}.picker{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <div class="mark">視</div><div class="eyebrow">DATA VISUALIZATION · LECTURE MATERIALS</div>
    <h1>데이터시각화 강의자료</h1><p>강의할 주차를 선택하면 전체화면 발표 덱이 열립니다.</p>
    <div class="picker"><label for="week-selector">주차 선택</label><select id="week-selector"><option value="Lecture_materials/Week1/">1주차 · 강의계획</option><option value="Lecture_materials/Week2/">2주차 · Python 분석 환경과 NumPy 배열 기초</option></select><button id="open-week" type="button">강의 시작</button></div>
    <div class="note">현재 1–2주차가 배포되어 있습니다.</div>
  </main>
  <script>const selector=document.getElementById('week-selector');document.getElementById('open-week').addEventListener('click',()=>location.href=selector.value);selector.addEventListener('keydown',event=>{if(event.key==='Enter')location.href=selector.value});</script>
</body>
</html>
